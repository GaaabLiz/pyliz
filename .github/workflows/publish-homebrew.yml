name: Publish Homebrew

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing the Homebrew tap token
        required: true
        type: string
      uv_version:
        description: Exact uv release used by the project workflows
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish formula to tap
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Python project
        uses: ./.github/actions/setup-project
        with:
          uv-version: ${{ inputs.uv_version }}

      - name: Generate Homebrew formula
        run: make ci-generate-homebrew-formula

      - name: Publish formula to tap
        run: make ci-publish-homebrew
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
