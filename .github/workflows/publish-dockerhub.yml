name: Publish Docker Hub

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing Docker Hub credentials
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker Hub login
        run: make ci-docker-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker image tag
        id: docker_tag
        run: make ci-export-docker-tag

      - name: Build and push Docker image
        run: make ci-publish-dockerhub
        env:
          DOCKER_IMAGE_TAG: ${{ steps.docker_tag.outputs.docker_image_tag }}
