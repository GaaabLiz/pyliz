name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color .github/workflows/*.yml

  ci-config:
    name: Read CI Config
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.config.outputs.python_version }}
      test_os_matrix: ${{ steps.config.outputs.test_os_matrix }}
      uv_version: ${{ steps.config.outputs.uv_version }}
      release_notes_file: ${{ steps.config.outputs.release_notes_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export and validate CI configuration
        id: config
        run: make ci-export-config

  quality:
    name: Quality (Python ${{ needs.ci-config.outputs.python_version }})
    needs: ci-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_PYTHON_VERSION: ${{ needs.ci-config.outputs.python_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Python project
        uses: ./.github/actions/setup-project
        with:
          uv-version: ${{ needs.ci-config.outputs.uv_version }}
          python-version: ${{ needs.ci-config.outputs.python_version }}

      - name: Run quality checks
        run: make ci-quality

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ needs.ci-config.outputs.python_version }})
    needs: ci-config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.ci-config.outputs.test_os_matrix) }}
    env:
      CI_PYTHON_VERSION: ${{ needs.ci-config.outputs.python_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux libraries for Qt tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Set up the Python project
        uses: ./.github/actions/setup-project
        with:
          uv-version: ${{ needs.ci-config.outputs.uv_version }}
          python-version: ${{ needs.ci-config.outputs.python_version }}

      - name: Run tests
        run: make ci-test

  build-package:
    name: Build and smoke-test distributions
    needs:
      - ci-config
      - quality
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_PYTHON_VERSION: ${{ needs.ci-config.outputs.python_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the Python project
        uses: ./.github/actions/setup-project
        with:
          uv-version: ${{ needs.ci-config.outputs.uv_version }}
          python-version: ${{ needs.ci-config.outputs.python_version }}

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: make ci-verify-release-version

      - name: Generate per-release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: make ci-generate-release-notes

      - name: Build wheel and source distribution
        if: startsWith(github.ref, 'refs/tags/v')
        run: make ci-build-release-package

      - name: Build wheel and source distribution
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: make build

      - name: Smoke-test distributions
        run: make ci-smoke-build

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload per-release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ needs.ci-config.outputs.release_notes_file }}
          if-no-files-found: error
