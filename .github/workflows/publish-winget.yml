name: Publish WinGet

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing the WinGet GitHub token
        required: true
        type: string
      uv_version:
        description: Exact uv release used by the project workflows
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish WinGet pull request
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-windows
          path: .

      - name: Install Make
        run: choco install make --yes

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ inputs.uv_version }}
          enable-cache: true

      - name: Setup CI environment
        run: make ci-setup

      - name: Generate WinGet manifests
        run: make ci-generate-winget-manifests

      - name: Validate WinGet manifests
        run: make ci-validate-winget-manifests

      - name: Publish WinGet pull request
        run: make ci-publish-winget
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
